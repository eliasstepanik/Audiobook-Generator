# Docker Compose for AMD GPU (ROCm) support
# Usage: docker-compose -f docker-compose.rocm.yml up -d
#
# IMPORTANT: gfx1151 (Radeon 8060S/Strix Halo) is NOT currently supported by ROCm!
# See: https://github.com/ROCm/ROCm/issues/5824
# If you have gfx1151, use TTS_DEVICE=cpu or wait for ROCm to add support.
#
# Supported GPUs: gfx900, gfx906, gfx908, gfx90a, gfx1030, gfx1100
# Check your GPU: rocminfo | grep gfx

services:
  audiobook-generator:
    build:
      context: .
      dockerfile: Dockerfile.rocm
    container_name: audiobook-generator-rocm
    ports:
      - "8000:8000"
    volumes:
      # Persist data and config
      - ./data:/app/data
      - ./config.yml:/app/config.yml:ro
      # Model cache (prevents re-downloading models)
      - audiobook-models-rocm:/home/appuser/.cache
    devices:
      # Pass through AMD GPU
      - /dev/kfd
      - /dev/dri
    # Use host GIDs for GPU access (run 'getent group video render' on host to verify)
    group_add:
      - video
      - render
    security_opt:
      - seccomp:unconfined
    # Uncomment to run as root for debugging GPU access issues:
    # user: root
    environment:
      # Force CPU mode (required for unsupported GPUs like gfx1151)
      - TTS_DEVICE=cpu
      # Override HSA version for different GPU architectures:
      # - HSA_OVERRIDE_GFX_VERSION=11.0.0  # gfx1100 (RX 7900)
      # - HSA_OVERRIDE_GFX_VERSION=10.3.0  # gfx1030 (RX 6800/6900)
      - INSTALL_FLASH_ATTN=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/stats')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  audiobook-models-rocm:
    name: audiobook-generator-models-rocm
