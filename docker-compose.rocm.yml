version: '3.8'

# Docker Compose for AMD GPU (ROCm) support
# Usage: docker-compose -f docker-compose.rocm.yml up -d

services:
  audiobook-generator:
    build:
      context: .
      dockerfile: Dockerfile.rocm
    container_name: audiobook-generator-rocm
    ports:
      - "8000:8000"
    volumes:
      # Persist data and config
      - ./data:/app/data
      - ./config.yml:/app/config.yml:ro
      # Model cache (prevents re-downloading models)
      - audiobook-models-rocm:/home/appuser/.cache
    devices:
      # Pass through AMD GPU
      - /dev/kfd
      - /dev/dri
    # Use host GIDs for GPU access (run 'getent group video render' on host to verify)
    group_add:
      - video
      - render
    security_opt:
      - seccomp:unconfined
    # Uncomment to run as root for debugging GPU access issues:
    # user: root
    environment:
      # ROCm environment variables
      # gfx1151 (Radeon 8060S/RDNA 3.5) needs override to gfx1100 for PyTorch compatibility
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      - PYTORCH_ROCM_ARCH=gfx1100
      # Adjust HSA_OVERRIDE_GFX_VERSION for your GPU architecture:
      # 9.0.0   - gfx900  - Vega 10 (RX Vega 56/64, MI25)
      # 9.0.6   - gfx906  - Vega 20 (MI50/MI60, Radeon VII)
      # 9.0.8   - gfx908  - MI100
      # 9.0.10  - gfx90a  - MI200 series
      # 10.3.0  - gfx1030 - RDNA 2 (RX 6800/6900)
      # 11.0.0  - gfx1100 - RDNA 3 (RX 7900) and RDNA 3.5 (gfx1151)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/stats')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  audiobook-models-rocm:
    name: audiobook-generator-models-rocm
